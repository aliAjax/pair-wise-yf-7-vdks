<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>活字排版工坊</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">本地活字印章排版</p>
          <h1>活字排版工坊</h1>
        </div>
        <div class="top-actions">
          <button id="saveDraftBtn" class="primary">保存草稿</button>
          <button id="exportBtn">导出预览图</button>
          <button id="clearBoardBtn">清空版面</button>
        </div>
      </header>

      <nav class="tabs" role="tablist" aria-label="工作台切换">
        <button id="tabBoard" class="tab-btn active" type="button" data-tab="board">排版台</button>
        <button id="tabLedger" class="tab-btn" type="button" data-tab="ledger">
          补字账房
          <span id="ledgerAlert" class="tab-dot" hidden></span>
        </button>
      </nav>

      <section id="boardView" class="workspace">
        <aside class="panel inventory-panel">
          <div class="panel-head">
            <h2>字模库</h2>
            <span id="inventoryCount"></span>
          </div>
          <form id="typeForm" class="type-form">
            <input id="charInput" maxlength="2" placeholder="字" required />
            <input id="styleInput" placeholder="风格" required />
            <input id="sizeInput" type="number" min="8" max="72" value="24" required />
            <input id="quantityInput" type="number" min="1" max="99" value="3" required />
            <select id="wearInput">
              <option value="新">新</option>
              <option value="微磨">微磨</option>
              <option value="旧痕">旧痕</option>
            </select>
            <button class="primary" type="submit">加入</button>
          </form>
          <div class="filter-row">
            <input id="inventorySearch" type="search" placeholder="搜索字或风格" />
            <select id="styleFilter">
              <option value="all">全部风格</option>
            </select>
          </div>
          <div id="typeList" class="type-list"></div>
        </aside>

        <section class="stage-wrap">
          <div class="status-strip">
            <div>
              <strong id="selectedTypeLabel">未选择字模</strong>
              <span>点击字模后，在版面格子中落字，也可拖拽字模到版面。</span>
            </div>
            <div id="shortageBadge" class="badge ok">数量充足</div>
          </div>
          <div id="stage" class="stage" aria-label="排版画布"></div>
        </section>

        <aside class="panel draft-panel">
          <div class="panel-head">
            <h2>草稿与核对</h2>
            <span id="placedCount"></span>
          </div>
          <div id="usageList" class="usage-list"></div>
          <div class="divider"></div>
          <h3>已保存草稿</h3>
          <div id="draftList" class="draft-list"></div>
        </aside>
      </section>

      <section id="ledgerView" class="ledger" hidden>
        <div class="ledger-grid">
          <section class="panel ledger-panel">
            <div class="panel-head">
              <h2>版面缺字汇总</h2>
              <button id="requestAllBtn" class="mini-primary" type="button">一键托铸</button>
            </div>
            <p class="hint">按「字 + 风格」归并缺口；有抵用先冲抵，有未结补字单就接着跟。</p>
            <div id="shortageList" class="ledger-table"></div>
          </section>

          <section class="panel ledger-panel">
            <div class="panel-head">
              <h2>草稿解锁</h2>
              <span id="draftUnlockCount"></span>
            </div>
            <p class="hint">补字到账、字模数量更新后自动重算，缺口清零才解锁载入。</p>
            <div id="draftUnlockList" class="draft-list"></div>
          </section>

          <section class="panel ledger-panel wide">
            <div class="panel-head">
              <h2>外协补字单</h2>
              <span id="orderCount"></span>
            </div>
            <div id="orderList" class="order-list"></div>
          </section>

          <section class="panel ledger-panel">
            <div class="panel-head">
              <h2>回货登记 · 分批核销</h2>
            </div>
            <form id="receiptForm" class="receipt-form">
              <div class="receipt-head">
                <label>回单号
                  <input id="receiptNoInput" placeholder="例：HD-1007-03" required />
                </label>
                <label>铸字房
                  <input id="foundryInput" placeholder="外协铸字房（可空）" />
                </label>
              </div>
              <div class="receipt-lines-head">
                <span>字</span><span>风格</span><span>枚数</span><span></span>
              </div>
              <div id="receiptLines"></div>
              <div class="receipt-actions">
                <button id="addRowBtn" type="button">加一行</button>
                <button id="fillOutstandingBtn" type="button">按未结单填入</button>
                <button class="primary" type="submit">登记并核销</button>
              </div>
              <p id="receiptError" class="form-error" hidden></p>
            </form>
          </section>

          <section class="panel ledger-panel">
            <div class="panel-head">
              <h2>回单批次</h2>
              <span id="receiptCount"></span>
            </div>
            <div id="receiptList" class="receipt-list"></div>
          </section>

          <section class="panel ledger-panel">
            <div class="panel-head">
              <h2>溢发抵用</h2>
              <span id="creditCount"></span>
            </div>
            <div id="creditList" class="credit-list"></div>
          </section>

          <section class="panel ledger-panel">
            <div class="panel-head">
              <h2>挂账待裁</h2>
              <span id="suspenseCount"></span>
            </div>
            <div id="suspenseList" class="suspense-list"></div>
          </section>
        </div>
      </section>
    </main>

    <div id="toastHost" class="toast-host" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
